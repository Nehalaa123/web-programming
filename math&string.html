<html>
<body bgcolor="pink">
<h1><center><i>Maths and String Functions</i></center></h1>

<script>
var a="Helloo";
var b="world";
var c="welcome !!";
var d=a+b+c;
document.write("string 1 : " + a + "<br><br>");
document.write("string 2 : " + b + "<br><br>");
document.write("string 3 : " + c + "<br><br>");

document.write("<h2><i>String Functions<i></h2>");
document.write("1.Concatination = ", a+b+c+"<br>");
document.write("2.Length = ", d.length+ "<br>");
document.write("3.Uppercase = ", d.toUpperCase()+ "<br>");
document.write("4.Lowercase = ", d.toLowerCase()+ "<br>");
document.write("5.Slice = ", d.slice(3,6)+ "<br>")
document.write("6.Replace =", a.replace("o","i")+ "<br>"); 

document.write("<h2><i>Math Functions<i></h2>");
document.write("1.Round =", Math.round(2.5)+ "<br>");
document.write("2.Floor =", Math.floor(6.5)+ "<br>");
document.write("3.Ceil =", Math.ceil(6.5)+ "<br>");
document.write("4.Squareroot =", Math.sqrt(25)+ "<br>");
document.write("5.Power =", Math.pow(2,3)+ "<br>");
document.write("5.Absolute =", Math.abs(-10)+ "<br>");
document.write("5.Maximum =", Math.max(20,30,40)+ "<br>");
document.write("5.Minimum =", Math.min(10,20,30)+ "<br>");
</script>
