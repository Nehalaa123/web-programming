<html>
<head>
<title>change color</title
</head>
<body>
<h1>Change Background</h1>
<button onclick="changecolor()">Change</button>
<script>
let color =["purple","yellow","blue","pink"];
let i=0
function changecolor()
{
document.body.style.backgroundColor=color[i];
i++;
if(i==color.length)
{
i=0;
}
}
</script>
</body>
</html>
